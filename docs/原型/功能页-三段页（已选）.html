<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>飞猪帮你省 · 三段页</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:390px; height:844px; overflow:hidden; }
  body {
    font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif;
    background:#F2F3F5; color:#14171A;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  .statusbar {
    height:44px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; font-size:13px; font-weight:600; color:#3B2A22;
    background:#FFEDE3;
  }
  .head { background:#FFEDE3; padding:2px 16px 14px; }
  .head .brand { display:flex; align-items:baseline; justify-content:space-between; }
  .head .brand h1 { font-size:19px; letter-spacing:-.2px; }
  .head .brand h1 em { font-style:normal; color:#FF5B23; }
  .head .brand button {
    border:0; background:rgba(255,255,255,.75); color:#FF5B23; font-family:inherit;
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px;
  }
  .seg { display:flex; gap:4px; margin-top:13px; background:rgba(255,255,255,.6); padding:4px; border-radius:12px; }
  .seg div {
    flex:1; text-align:center; font-size:13px; color:#8A6B5C; padding:8px 0; border-radius:9px;
    position:relative;
  }
  .seg div.on { background:#fff; color:#FF4E00; font-weight:700; box-shadow:0 1px 3px rgba(20,23,26,.08); }
  .seg div b {
    position:absolute; top:3px; right:16px; width:6px; height:6px;
    background:#FF4E00; border-radius:50%;
  }

  .hint {
    margin:11px 16px 0; display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; color:#656C76;
  }
  .hint i { font-style:normal; color:#FF5B23; }

  .askrow {
    margin:9px 16px 0; background:#fff; border-radius:12px; padding:9px 9px 9px 13px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .askrow span { font-size:12px; color:#6B7280; }
  .askrow b {
    background:#FF5B23; color:#fff; font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:9px; white-space:nowrap;
  }

  .card { margin:9px 16px 0; background:#fff; border-radius:16px; padding:16px 16px 14px; }
  .card .top { display:flex; align-items:flex-start; justify-content:space-between; }
  .card .flt { font-size:22px; font-weight:700; letter-spacing:-.4px; }
  .card .flt small { display:block; font-size:11.5px; color:#656C76; font-weight:400; letter-spacing:0; margin-top:4px; }
  .card .state {
    font-size:11px; color:#0B7A48; background:#EAF7F0; padding:4px 9px; border-radius:999px;
    font-weight:600; white-space:nowrap;
  }
  .prices { display:flex; align-items:flex-end; justify-content:space-between; margin-top:16px; }
  .prices .now { font-size:34px; font-weight:700; color:#FF4E00; letter-spacing:-1px; line-height:1; }
  .prices .now small { font-size:11px; font-weight:400; color:#656C76; letter-spacing:0; margin-left:4px; }
  .prices .tgt { font-size:11.5px; color:#656C76; line-height:1.5; text-align:right; padding-bottom:4px; }
  .prices .tgt b { display:block; font-size:16px; color:#14171A; }

  .chart { margin-top:14px; }
  .chart .axis { display:flex; justify-content:space-between; font-size:11px; color:#6B7280; margin-top:6px; }
  .delta {
    margin-top:11px; font-size:12px; color:#5A616B; background:#FAFAFB;
    border-radius:10px; padding:9px 11px; line-height:1.5;
  }
  .delta b { color:#FF4E00; }

  .push { margin:13px 16px 0; }
  .push .cap { font-size:12px; color:#5A616B; font-weight:600; }
  .chips { display:flex; gap:7px; margin-top:9px; }
  .chip {
    font-size:11.5px; padding:8px 12px; border-radius:999px; background:#fff;
    color:#5A616B; border:1px solid #E8EAED;
  }
  .chip.on { background:#FFF3ED; border-color:#FFC7AC; color:#FF4E00; font-weight:600; }

  .list { margin:16px 16px 0; background:#fff; border-radius:14px; overflow:hidden; }
  .list .row {
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; font-size:12.5px; color:#4A5058;
  }
  .list .row + .row { border-top:1px solid #F0F1F3; }
  .list .row span { color:#656C76; font-size:11.5px; }
  .list .row b { color:#FF4E00; font-size:13.5px; }

  .foot {
    position:absolute; left:0; right:0; bottom:0; padding:12px 16px 20px;
    background:rgba(255,255,255,.96); border-top:1px solid #ECEDEF;
    display:flex; gap:9px;
  }
  .foot button {
    font-family:inherit; font-size:13.5px; font-weight:700; border-radius:12px; padding:13px 0;
  }
  .foot .sec { flex:1; background:#F2F3F5; color:#4A5058; border:0; }
  .foot .pri { flex:1.4; background:#FF5B23; color:#fff; border:0; }
</style>
</head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span>5G ▮▮▮ 28</span>
  </div>

  <div class="head">
    <div class="brand">
      <h1>飞猪<em>帮你省</em></h1>
      <button>示例数据 · 一键更新</button>
    </div>
    <div class="seg">
      <div>省心<b></b></div>
      <div class="on">省钱</div>
      <div>省时间</div>
    </div>
  </div>

  <div class="hint">
    <span>正在盯 2 个航班 · <i>3 分钟前更新</i></span>
    <span>全部 ›</span>
  </div>

  <div class="askrow">
    <span>输入航班号，例如 MU5101</span><b>加盯</b>
  </div>

  <div class="card">
    <div class="top">
      <div class="flt">MU5101<small>11.06 周四 09:05 · 首都 T2 → 虹桥 T2</small></div>
      <div class="state">盯着</div>
    </div>

    <div class="prices">
      <div class="now">¥468<small>现价起</small></div>
      <div class="tgt">目标价<b>¥420</b>还差 ¥48</div>
    </div>

    <div class="chart">
      <svg width="318" height="104" viewBox="0 0 318 104" fill="none">
        <line x1="0" y1="96" x2="318" y2="96" stroke="#FFC7AC" stroke-width="1.4" stroke-dasharray="4 4"/>
        <text x="0" y="91" fill="#C08A6E" font-size="9" font-family="PingFang SC">你的目标 ¥420</text>
        <polyline points="6,27 58,19 110,32 162,46 214,36 266,30 312,27" stroke="#FF5B23" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="312" cy="27" r="3.4" fill="#FF5B23"/>
        <circle cx="162" cy="46" r="2.4" fill="#fff" stroke="#FF5B23" stroke-width="1.6"/>
      </svg>
      <div class="axis"><span>10.31</span><span>11.01</span><span>11.02</span><span>11.03 今天</span></div>
    </div>

    <div class="delta">4 天里最低见过 <b>¥455</b>，最近一次变动是昨天 15:20 降了 ¥12。</div>
  </div>

  <div class="push">
    <div class="cap">什么时候推我</div>
    <div class="chips">
      <div class="chip on">降价就推</div>
      <div class="chip on">每天 9:00</div>
      <div class="chip">起飞前 6 小时</div>
    </div>
  </div>

  <div class="push" style="margin-top:16px">
    <div class="cap">推送记录</div>
  </div>
  <div class="list" style="margin-top:9px">
    <div class="row"><div>今天 9:41 · MU5101</div><span>降 ¥12 → <b>¥468</b></span></div>
  </div>

  <div class="foot">
    <button class="sec">调目标价</button>
    <button class="pri">再盯一个航班</button>
  </div>
</body>
</html>
